name: Elm CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Read .nvmrc
        run: echo NVMRC=`cat .nvmrc` >> $GITHUB_ENV
      - uses: actions/setup-node@v2
        with:
          node-version: ${{ env.NVMRC }}
      - name: Install Elm
        run: npm install -g elm@0.19.2-0
      - name: Compile Elm
        run: elm make src/**/*.elm
      - name: Compile Elm Example
        run: cd example; elm make src/**/*.elm
      - name: Run elm-format
        run: npx elm-format@0.8.8 --validate .
      - name: Run elm-tests
        run: npx elm-test@0.19.2-1
